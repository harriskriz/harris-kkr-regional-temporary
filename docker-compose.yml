services:
  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      API_PORT: 3050
    ports:
      - "${API_HOST_PORT:-3050}:3050"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4500}:80"
    restart: unless-stopped
